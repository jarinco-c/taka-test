<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手書き文字認識 (Claude OCR)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      background: #f5f5f0;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: #1a1a1a;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 2rem;
      width: 100%;
      max-width: 680px;
    }

    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #555; }

    .drop-zone {
      border: 2px dashed #bbb;
      border-radius: 8px;
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 1.25rem;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #5b5ef4;
      background: #f0f0ff;
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-zone .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .drop-zone .hint { font-size: 0.85rem; color: #888; }
    .drop-zone .filename { font-size: 0.9rem; font-weight: 600; color: #5b5ef4; margin-top: 0.5rem; }

    input[type="text"], textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    input[type="text"]:focus, textarea:focus { border-color: #5b5ef4; }

    .field { margin-bottom: 1.25rem; }
    .field small { font-size: 0.78rem; color: #999; margin-top: 0.3rem; display: block; }

    button[type="submit"] {
      width: 100%;
      background: #5b5ef4;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    button[type="submit"]:hover { background: #4345d8; }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

    .progress {
      display: none;
      margin-top: 1.5rem;
      text-align: center;
      color: #5b5ef4;
      font-size: 0.9rem;
    }
    .spinner {
      display: inline-block;
      width: 1.4rem; height: 1.4rem;
      border: 3px solid #ddd;
      border-top-color: #5b5ef4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .results {
      margin-top: 2rem;
      width: 100%;
      max-width: 680px;
    }
    .results h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #1a1a1a; }

    .page-block {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    .page-block .page-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #5b5ef4;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.6rem;
    }
    .page-block pre {
      white-space: pre-wrap;
      word-break: break-all;
      font-family: "Hiragino Sans", "Meiryo", monospace;
      font-size: 0.95rem;
      line-height: 1.8;
      color: #222;
    }
    .copy-btn {
      background: none;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 0.2rem 0.6rem;
      font-size: 0.78rem;
      cursor: pointer;
      color: #666;
      float: right;
      margin-top: -0.2rem;
      transition: background 0.15s;
    }
    .copy-btn:hover { background: #f0f0ff; border-color: #5b5ef4; color: #5b5ef4; }

    .error-msg {
      background: #fff0f0;
      border: 1px solid #f5c0c0;
      border-radius: 8px;
      padding: 1rem;
      color: #c0392b;
      font-size: 0.9rem;
      margin-top: 1.5rem;
      max-width: 680px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>手書き文字認識</h1>
  <p class="subtitle">古い手書きPDFをテキストに変換します (Claude OCR)</p>

  <div class="card">
    <form id="form">
      <div class="field">
        <label>PDFファイル</label>
        <div class="drop-zone" id="dropZone">
          <input type="file" id="fileInput" name="file" accept=".pdf" required />
          <div class="icon">📄</div>
          <div>クリックまたはドラッグ＆ドロップでPDFを選択</div>
          <div class="hint">手書き文字が含まれるPDFをアップロードしてください</div>
          <div class="filename" id="filename"></div>
        </div>
      </div>

      <div class="field">
        <label for="pages">読み取るページ（省略時: 全ページ）</label>
        <input type="text" id="pages" name="pages" placeholder="例: 1,3,5 または 1-3 または空白で全ページ" />
        <small>カンマ区切りやハイフンで範囲指定できます</small>
      </div>

      <div class="field">
        <label for="hint">補足情報・ヒント（任意）</label>
        <input type="text" id="hint" name="hint" placeholder="例: 明治時代の手紙、縦書き、崩し字が多い" />
        <small>文書の時代・種類・特徴などを入力するとより正確に認識されます</small>
      </div>

      <button type="submit" id="submitBtn">文字を読み取る</button>
    </form>

    <div class="progress" id="progress">
      <span class="spinner"></span>Claudeが文字を読み取っています…しばらくお待ちください
    </div>
  </div>

  <div id="errorMsg" class="error-msg" style="display:none;"></div>
  <div class="results" id="results"></div>

  <script>
    const form = document.getElementById('form');
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const filenameEl = document.getElementById('filename');
    const progress = document.getElementById('progress');
    const submitBtn = document.getElementById('submitBtn');
    const resultsEl = document.getElementById('results');
    const errorMsg = document.getElementById('errorMsg');

    fileInput.addEventListener('change', () => {
      const f = fileInput.files[0];
      filenameEl.textContent = f ? f.name : '';
    });

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        const dt = new DataTransfer();
        dt.items.add(files[0]);
        fileInput.files = dt.files;
        filenameEl.textContent = files[0].name;
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      resultsEl.innerHTML = '';

      const formData = new FormData(form);
      submitBtn.disabled = true;
      progress.style.display = 'block';

      try {
        const res = await fetch('/recognize', { method: 'POST', body: formData });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || `エラー: ${res.status}`);
        }

        renderResults(data);
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        progress.style.display = 'none';
      }
    });

    function renderResults(data) {
      const header = document.createElement('h2');
      header.textContent = `認識結果（全${data.total_pages}ページ中 ${data.results.length}ページ）`;
      resultsEl.appendChild(header);

      for (const r of data.results) {
        const block = document.createElement('div');
        block.className = 'page-block';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = 'コピー';
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(r.text).then(() => {
            copyBtn.textContent = 'コピー完了!';
            setTimeout(() => copyBtn.textContent = 'コピー', 1500);
          });
        };

        const label = document.createElement('div');
        label.className = 'page-label';
        label.textContent = `ページ ${r.page}`;
        label.appendChild(copyBtn);

        const pre = document.createElement('pre');
        pre.textContent = r.text;

        block.appendChild(label);
        block.appendChild(pre);
        resultsEl.appendChild(block);
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手書き文字認識</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      background: #f5f5f0;
      color: #333;
      min-height: 100vh;
      padding: 1.5rem 1rem 4rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 0.2rem;
    }
    .subtitle {
      font-size: 0.82rem;
      color: #888;
      margin-bottom: 1.5rem;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 1.25rem;
      max-width: 640px;
      margin: 0 auto;
    }

    /* ---- Upload area ---- */
    .upload-area {
      border: 2px dashed #bbb;
      border-radius: 10px;
      padding: 1.5rem 1rem;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 1rem;
    }
    .upload-area.drag-over,
    .upload-area:focus-within {
      border-color: #5b5ef4;
      background: #f2f2ff;
    }
    .upload-area input[type="file"] {
      position: absolute; inset: 0; opacity: 0;
      cursor: pointer; width: 100%; height: 100%;
    }
    .upload-area .icon { font-size: 2.2rem; margin-bottom: 0.4rem; }
    .upload-area .main-text { font-size: 0.95rem; font-weight: 600; }
    .upload-area .sub-text  { font-size: 0.78rem; color: #999; margin-top: 0.25rem; }
    .upload-area .chosen    { font-size: 0.88rem; font-weight: 600; color: #5b5ef4; margin-top: 0.5rem; word-break: break-all; }

    /* Camera shortcut button (shown on mobile) */
    .camera-btn {
      display: none;
      width: 100%;
      background: #f0f0ff;
      border: 1.5px solid #bbbef8;
      border-radius: 10px;
      padding: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #5b5ef4;
      cursor: pointer;
      margin-bottom: 1rem;
      position: relative;
    }
    .camera-btn input[type="file"] {
      position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
    }
    @media (pointer: coarse) {
      .camera-btn { display: block; }
    }

    /* ---- Form fields ---- */
    .field { margin-bottom: 0.9rem; }
    label  { display: block; font-size: 0.82rem; font-weight: 600; color: #555; margin-bottom: 0.3rem; }
    input[type="text"] {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      font-size: 0.92rem;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #5b5ef4; }
    .field small { font-size: 0.75rem; color: #aaa; margin-top: 0.25rem; display: block; }

    /* ---- Submit button ---- */
    .submit-btn {
      display: block;
      width: 100%;
      background: #5b5ef4;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      /* sticky on mobile */
      position: sticky;
      bottom: 1rem;
      box-shadow: 0 4px 14px rgba(91,94,244,0.35);
    }
    .submit-btn:hover  { background: #4345d8; }
    .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ---- Progress ---- */
    .progress {
      display: none;
      text-align: center;
      padding: 1.2rem 0 0.5rem;
      color: #5b5ef4;
      font-size: 0.9rem;
    }
    .spinner {
      display: inline-block;
      width: 1.3rem; height: 1.3rem;
      border: 3px solid #ddd;
      border-top-color: #5b5ef4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Results ---- */
    .results { max-width: 640px; margin: 1.25rem auto 0; }
    .results h2 { font-size: 1rem; margin-bottom: 0.75rem; color: #333; }

    .page-block {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 1rem 1.1rem;
      margin-bottom: 0.9rem;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }
    .page-label { font-size: 0.78rem; font-weight: 700; color: #5b5ef4; letter-spacing: 0.03em; }
    .copy-btn {
      background: #f0f0ff;
      border: 1px solid #c0c2f8;
      border-radius: 6px;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #5b5ef4;
      cursor: pointer;
      /* larger touch target */
      min-height: 36px;
      min-width: 72px;
    }
    .copy-btn:active { background: #e0e0ff; }

    pre {
      white-space: pre-wrap;
      word-break: break-all;
      font-family: "Hiragino Sans", "Meiryo", monospace;
      font-size: 0.95rem;
      line-height: 1.85;
      color: #222;
    }

    .error-msg {
      background: #fff0f0;
      border: 1px solid #f5c0c0;
      border-radius: 10px;
      padding: 0.9rem 1rem;
      color: #c0392b;
      font-size: 0.88rem;
      margin-top: 1.25rem;
      max-width: 640px;
    }
  </style>
</head>
<body>
  <h1>手書き文字認識</h1>
  <p class="subtitle">PDF・写真をアップロードしてテキストに変換 (Claude OCR)</p>

  <div class="card">
    <form id="form">

      <!-- Camera shortcut: shown only on touch devices -->
      <div class="camera-btn">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" />
        📷 カメラで撮影する
      </div>

      <!-- File drop zone -->
      <div class="upload-area" id="dropZone">
        <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" />
        <div class="icon">📄</div>
        <div class="main-text">タップしてファイルを選択</div>
        <div class="sub-text">PDF / JPG / PNG 対応</div>
        <div class="chosen" id="filename"></div>
      </div>

      <div class="field">
        <label for="pages">読み取るページ（PDF・省略時は全ページ）</label>
        <input type="text" id="pages" name="pages" placeholder="例: 1,3,5 または 1-3" />
        <small>画像ファイルの場合は不要</small>
      </div>

      <div class="field">
        <label for="hint">補足情報・ヒント（任意）</label>
        <input type="text" id="hint" name="hint" placeholder="例: 金型管理台帳、表形式、手書き" />
        <small>文書の種類や特徴を入力するとより正確に認識されます</small>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">文字を読み取る</button>
    </form>

    <div class="progress" id="progress">
      <span class="spinner"></span>読み取っています…
    </div>
  </div>

  <div id="errorMsg" class="error-msg" style="display:none;"></div>
  <div class="results" id="results"></div>

  <script>
    const form        = document.getElementById('form');
    const fileInput   = document.getElementById('fileInput');
    const cameraInput = document.getElementById('cameraInput');
    const dropZone    = document.getElementById('dropZone');
    const filenameEl  = document.getElementById('filename');
    const progress    = document.getElementById('progress');
    const submitBtn   = document.getElementById('submitBtn');
    const resultsEl   = document.getElementById('results');
    const errorMsg    = document.getElementById('errorMsg');

    let selectedFile = null;

    function setFile(file) {
      selectedFile = file;
      filenameEl.textContent = file ? file.name : '';
    }

    fileInput.addEventListener('change',   () => setFile(fileInput.files[0]));
    cameraInput.addEventListener('change', () => setFile(cameraInput.files[0]));

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      resultsEl.innerHTML = '';

      if (!selectedFile) {
        errorMsg.textContent = 'ファイルを選択してください';
        errorMsg.style.display = 'block';
        return;
      }

      const formData = new FormData();
      formData.append('file', selectedFile);
      formData.append('pages', document.getElementById('pages').value);

      submitBtn.disabled = true;
      progress.style.display = 'block';

      try {
        const res  = await fetch('/recognize', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || `エラー: ${res.status}`);
        renderResults(data);
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        progress.style.display = 'none';
      }
    });

    function renderResults(data) {
      const h = document.createElement('h2');
      h.textContent = data.total_pages === 1
        ? '認識結果'
        : `認識結果（全${data.total_pages}ページ中 ${data.results.length}ページ）`;
      resultsEl.appendChild(h);

      for (const r of data.results) {
        const block = document.createElement('div');
        block.className = 'page-block';

        const header = document.createElement('div');
        header.className = 'page-header';

        const label = document.createElement('div');
        label.className = 'page-label';
        label.textContent = data.total_pages === 1 ? '読み取り結果' : `ページ ${r.page}`;

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.type = 'button';
        copyBtn.textContent = 'コピー';
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(r.text).then(() => {
            copyBtn.textContent = '完了!';
            setTimeout(() => copyBtn.textContent = 'コピー', 1500);
          });
        };

        header.appendChild(label);
        header.appendChild(copyBtn);

        const pre = document.createElement('pre');
        pre.textContent = r.text;

        block.appendChild(header);
        block.appendChild(pre);
        resultsEl.appendChild(block);
      }
    }
  </script>
</body>
</html>
